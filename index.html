<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoja de encargo · Único</title>
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1c1e20; --muted:#6a6e73; --line:#e1ddd4; --line2:#cfc9bd;
  --accent:#1e5d58; --accent-ink:#fff; --accent-soft:#e2eeec;
  --warn:#b2442a; --warn-soft:#fbeae5; --ok:#2d7a4d; --ok-soft:#e5f3ea; --no:#7d2a1b;
  --r:10px; --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.top .who{margin-left:8px;padding-left:14px;border-left:1px solid var(--line);min-width:0}
.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.top .who span{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.pill.borrador{background:#f1ece0;color:#7a6526}
.pill.firmado{background:var(--ok-soft);color:var(--ok)}
.sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--warn);border-color:#e3b9ad}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;max-width:1240px;margin:0 auto;padding:20px 18px 80px}
.side{position:sticky;top:76px;align-self:start}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-weight:600}
.nav a:hover{background:var(--bg)}
.nav a .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.done{background:var(--ok)}
.dot.part{background:#d49a2a}
.sums{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.sums div{display:flex;justify-content:space-between;padding:3px 0}
.sums .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.sums .iva{color:var(--muted);font-size:12px}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.45}

/* ---------- form ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;scroll-margin-top:80px}
.card>h2{margin:0;padding:14px 18px;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>h2 .cnt{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;padding:14px 18px 18px}
.f{padding:8px 0;min-width:0}
.f.wide{grid-column:1/-1}
.f.nl{grid-column-start:1}
.f>label,.f>.lab{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.f .req{color:var(--warn);margin-left:2px}
.f input[type=text],.f input[type=tel],.f input[type=email],.f input[type=date],.f input[type=number],.f textarea,.f select{
  width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;outline:none}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f.miss.show input,.f.miss.show textarea{border-color:var(--warn);background:var(--warn-soft)}
.f.miss.show .yn button{border-color:var(--warn)}
.f.miss.show>label,.f.miss.show>.lab{color:var(--warn)}
.f .help{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.combo{position:relative;display:flex}
.combo input{flex:1;border-top-right-radius:0!important;border-bottom-right-radius:0!important}
.combo-btn{border:1px solid var(--line2);border-left:0;border-radius:0 8px 8px 0;background:#fff;padding:0 13px;font-size:14px}
.combo-btn:hover{background:var(--bg)}
.combo-list{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:240px;overflow:auto;padding:4px}
.combo-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.combo-list button:hover{background:var(--accent-soft)}
.combo-list button.kbd{background:var(--accent);color:var(--accent-ink)}
.combo-list button.kbd[data-prov]{color:var(--accent-ink)}
.combo-empty{padding:8px 10px;color:var(--muted);font-size:13px}

.f{position:relative}
.notabtn{position:absolute;right:0;top:8px;border:0;background:none;color:var(--accent);font-size:12px;font-weight:700;padding:0 2px;cursor:pointer}
.notabtn.inline{position:static;margin-left:8px}
.notabtn:hover{text-decoration:underline}
.notabox{margin-top:6px;position:relative}
.notax{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px}
.notax:hover{color:var(--warn)}
.notabox textarea{width:100%;min-height:44px;padding:7px 28px 7px 10px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);font-size:13px;resize:vertical}
.el .el-nota{grid-column:1/-1;margin-top:0}
.doc .nota{flex-basis:100%;font-size:8.4pt;font-style:italic;color:#333;font-weight:500;margin-top:1px}
.doc .kv>div{flex-wrap:wrap}
.extra-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.extra-row{display:grid;grid-template-columns:1.3fr 1fr 1.3fr auto;gap:6px;align-items:center}
.extra-row input{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;min-width:0}
.extra-row .exdel{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
.extra-row .exdel:hover{color:var(--warn)}
.btn.sm.exadd{color:var(--accent);border-color:var(--accent)}
@media (max-width:560px){ .extra-row{grid-template-columns:1fr 1fr} .extra-row input[data-exf=modulo]{grid-column:1/-1} }
.combo-group{padding:8px 10px 3px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line)}
.combo-group:first-child{border-top:0}
.segwarn{color:var(--warn);font-size:12px;font-weight:700;margin-top:6px}
.segwarn:empty{display:none}
/* seguimiento: todo el texto de la columna al mismo tamaño */
.segpanel, .segpanel *{font-size:13px;line-height:1.45}
.segpanel b{font-weight:700}
.segblk{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.segpanel .segprov{padding:2px 6px;border:1px solid var(--line2);border-radius:6px;font-weight:700;background:#fff}
.segpanel .seglab{font-weight:650;font-size:13px}
.segpanel .seglab input{padding:6px 8px}
.seglab{display:block;font-size:12px;font-weight:650;margin:8px 0 3px}
.seglab input{width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:8px}
.combo-hint{padding:6px 10px 2px;color:var(--warn);font-size:12px;font-weight:700}
.combo-list .combo-addbtn{color:var(--accent);font-weight:700;border-top:1px solid var(--line)!important;margin-top:4px}
.f .help.warnmsg{color:var(--warn);font-weight:600}
.f input[type=date]{cursor:pointer}
.na{font-size:12px;border:1px dashed var(--line2);background:none;border-radius:6px;padding:7px 8px;color:var(--muted);white-space:nowrap}
.yn{display:flex;gap:6px}
.yn button{min-width:64px;padding:8px 14px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-weight:700}
.yn button.on.si{background:var(--accent);border-color:var(--accent);color:#fff}
.yn button.on.no{background:var(--no);border-color:var(--no);color:#fff}
.yn button:focus-visible{outline:3px solid var(--accent-soft)}
.detail{margin-top:8px}
.money{position:relative}
.money input{padding-right:30px!important;text-align:right;font-weight:700}
.unidad{position:relative}
.unidad input{padding-right:42px!important;text-align:right}
.unidad::after{content:attr(data-u);position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money::after{content:"€";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.clauses{margin:0 18px 16px;padding:10px 14px;background:var(--bg);border-radius:8px;font-size:13px;color:#444;line-height:1.5}
.clauses li{margin:2px 0}
.clauses ul{margin:0;padding-left:18px}

/* electro rows */
.el{display:grid;grid-template-columns:150px auto minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.el:first-of-type{border-top:0}
.el .nm{font-weight:650;font-size:14px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 10px;font-size:12px;font-weight:700;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button.on[data-v=inc]{background:var(--accent);color:#fff}
.seg button.on[data-v=no]{background:var(--no);color:#fff}
.seg button.on[data-v=cli]{background:#5b5f66;color:#fff}
.el input{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px}
.el input:disabled{background:var(--bg);color:var(--muted)}
.el.miss.show .seg{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.el.miss.show input.need{border-color:var(--warn);background:var(--warn-soft)}
.elsub{padding:10px 18px 4px;border-top:1px solid var(--line)}
.elsub .grid{padding:0 0 8px}
.eltot{display:flex;justify-content:flex-end;gap:18px;padding:12px 18px;border-top:1px solid var(--line);font-weight:800}

fieldset.lock{border:0;margin:0;padding:0;min-width:0}
.lockbar{background:var(--ok-soft);border:1px solid #bfe0cb;color:var(--ok);padding:12px 16px;border-radius:var(--r);margin-bottom:16px;display:flex;align-items:center;gap:12px;font-weight:600}

/* ---------- review ---------- */
.rev{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;max-width:1300px;margin:0 auto;padding:20px 18px 80px}
.rev .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.rev .panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.pend{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.pend li{padding:7px 8px;border-radius:6px;font-size:13px;display:flex;gap:8px;cursor:pointer}
.pend li:hover{background:var(--warn-soft)}
.pend li b{color:var(--warn);min-width:92px}
.allok{color:var(--ok);font-weight:700}
.pad{position:relative;border:1px solid var(--line2);border-radius:8px;background:#fff;height:150px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;cursor:crosshair}
.pad .ph{position:absolute;inset:auto 0 10px 0;text-align:center;color:#bbb;font-size:12px;pointer-events:none}
.pad .x{position:absolute;right:6px;top:6px}
.padlab{font-size:13px;font-weight:650;margin:12px 0 6px}
.acc{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:10px;background:var(--bg);border-radius:8px}
.acc input{margin-top:3px;width:18px;height:18px;flex:none}
.stack{display:flex;flex-direction:column;gap:8px}
.preview{background:#d9d5cc;border-radius:var(--r);padding:22px;overflow:auto}
.preview .doc{margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.18)}

/* ---------- modal / toast ---------- */
.mbg{position:fixed;inset:0;background:rgba(20,22,24,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:920px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.sm{max-width:440px}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:16px 18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.list td input,table.list td select{width:100%;padding:6px 8px;border:1px solid var(--line2);border-radius:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c1e20;color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;font-size:14px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}

/* ---------- document (screen + print) ---------- */
.doc{width:210mm;min-height:297mm;background:#fff;color:#111;padding:11mm 12mm;font-size:9.3pt;line-height:1.26;position:relative;font-family:var(--font)}
.doc .dh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:8px}
.doc .dh .co b{font-size:12pt;letter-spacing:.03em}
/* logotipo de texto */
.logo{display:inline-flex;align-items:flex-end;line-height:1;margin-bottom:4px;text-transform:none!important;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-stretch:condensed;white-space:nowrap}
.logo-u{color:#e2231a;font-weight:900;font-size:2.35em;line-height:.8;margin-right:.02em;letter-spacing:-.02em}
.logo-r{color:#111;font-weight:800;font-size:1.32em;letter-spacing:-.01em;padding-bottom:.02em}
.doc .dh .co .logo{font-size:12pt;display:flex;width:max-content}
.brand .logo{font-size:12px}
.brand .logo-r{color:var(--ink)}
.brand small{margin-top:2px}
.doc .dh .co{font-size:8.4pt;color:#333}
.doc .dh .tt{text-align:right}
.doc .dh .tt b{font-size:14pt;letter-spacing:.06em;display:block}
.doc h4{margin:6px 0 3px;font-size:8.6pt;letter-spacing:.08em;text-transform:uppercase;background:#eceae5;padding:2px 6px;border-left:3px solid #111}
.doc .kv{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.doc .kv.c3{grid-template-columns:1fr 1fr 1fr}
.doc .kv>div{display:flex;gap:6px;padding:1.3px 2px;border-bottom:1px dotted #bbb;break-inside:avoid;min-width:0}
.doc .kv>div.w{grid-column:1/-1}
.doc .kv .k{color:#555;flex:none;max-width:52%}
.doc .kv .v{font-weight:650;min-width:0;overflow-wrap:anywhere}
.doc .v.no{color:#7d2a1b}
.doc .pendv{color:#b2442a;font-weight:800}
.doc .cl{font-size:7.8pt;color:#333;margin:2px 0 0;padding-left:14px}
.doc .cl li{margin:1px 0}
.doc table{width:100%;border-collapse:collapse;font-size:9pt}
.doc table td,.doc table th{border-bottom:1px solid #ccc;padding:1.8px 5px;text-align:left;vertical-align:top}
.doc table th{font-size:7.8pt;text-transform:uppercase;letter-spacing:.05em;color:#555}
.doc td.num,.doc th.num{text-align:right;white-space:nowrap}
.doc .subt{display:flex;justify-content:flex-end;gap:12px;font-weight:800;padding:4px 5px 0}
.doc .totals{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.doc .totals table td{padding:3px 6px}
.doc .totals tr.big td{font-size:11pt;font-weight:800;border-top:2px solid #111;border-bottom:0}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;break-inside:avoid}
.doc .sig>div{border:1px solid #999;border-radius:4px;padding:5px 8px;min-height:26mm;display:flex;flex-direction:column}
.doc .sig .sl{font-size:7.8pt;text-transform:uppercase;letter-spacing:.06em;color:#555}
.doc .sig img{max-height:24mm;max-width:100%;object-fit:contain;margin:auto 0}
.doc .sig .fill{flex:1}
.doc .sig .sn{font-size:8.4pt;border-top:1px solid #ccc;padding-top:3px}
.doc .acctxt{margin-top:5px!important;font-size:8.4pt;margin-top:8px;padding:6px 8px;border:1px solid #111;break-inside:avoid}
.doc .df{margin-top:8px;font-size:7.4pt;color:#555;display:flex;justify-content:space-between;gap:10px;border-top:1px solid #ccc;padding-top:4px}
.doc .wm{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:58pt;font-weight:900;color:rgba(178,68,42,.12);transform:rotate(-24deg);pointer-events:none;letter-spacing:.08em}
/* Los bloques se parten entre páginas por filas (nunca una fila a medias ni un título suelto al pie) */
.doc .sec{break-inside:auto}
.doc .sec.keep{break-inside:avoid-page}
.doc h4{break-after:avoid;page-break-after:avoid}
.doc tr,.doc .kv>div,.doc .subt,.doc .noinc,.doc .cl li,.doc .obra,.doc .estado{break-inside:avoid;page-break-inside:avoid}
.doc .noinc{font-size:8.6pt;margin-top:4px;padding:3px 7px;background:#f7efec;border-left:3px solid #7d2a1b}
.doc.taller .dh .tt b{font-size:15pt}
/* hoja de taller: todo en mayúsculas (etiquetas, títulos y pie incluidos) */
.doc.taller{text-transform:uppercase}
.doc.taller .obra{border:2px solid #111;padding:6px 9px;margin:6px 0 4px;font-size:10pt}
.doc.taller .obra b{font-size:11pt}
.doc.taller .estado{font-weight:800;padding:4px 8px;margin-bottom:6px}
.doc.taller .estado.ok{background:#e5f3ea;color:#1f5e39}
.doc.taller .estado.bad{background:#fbeae5;color:#b2442a}
.doc.taller table td{padding:4px 5px;font-size:9.6pt}
.doc.taller td.ck{width:7mm;font-size:12pt;text-align:center;color:#444}
.doc.taller td.lb{width:34%;color:#444}
.doc.taller td.vl{font-weight:650}
.doc.taller .src{font-size:8pt;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:3px;white-space:nowrap}
.doc.taller .src.t{background:#e2eeec;color:#1e5d58}
.doc.taller .src.c{background:#ececec;color:#444}
.pvtabs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.pvtabs button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.pvtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

#print-root{display:none}
@page{size:A4;margin:9mm 11mm}
@media print{
  html,body{background:#fff}
  .app,.mbg,.toast{display:none!important}
  #print-root{display:block}
  #print-root .doc{box-shadow:none;margin:0;min-height:auto;width:auto;padding:0}
}
@media (max-width:900px){
  .wrap,.rev{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:1fr}
  .el{grid-template-columns:1fr 1fr}
  /* tablet en vertical: la barra de arriba pasa los botones a una segunda fila */
  .top{flex-wrap:wrap}
  .top .who{flex:1 1 auto}
  .top .who b{max-width:none}
  .top .sp{flex-basis:100%;height:0}
  .top .btn{flex:1 1 auto;text-align:center}
}
</style>
</head>
<body>
<script src="https://accounts.google.com/gsi/client" async defer></script>
